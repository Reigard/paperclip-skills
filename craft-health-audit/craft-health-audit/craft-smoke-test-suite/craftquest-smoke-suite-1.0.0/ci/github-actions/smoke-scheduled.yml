# smoke-scheduled.yml
# ─────────────────────────────────────────────────────────────────────────────
# Cron-based monitoring variant. Runs the suite on a schedule so you catch
# breakage that happens without a deploy (expired cert, upstream API down,
# DNS change, a CMS entry someone unpublished).
#
# Install: copy to .github/workflows/smoke-scheduled.yml.
# Adjust the cron below. Times are UTC.
# ─────────────────────────────────────────────────────────────────────────────
name: Smoke — scheduled

on:
  schedule:
    # Every 30 minutes. Tighten or loosen to taste (and mind Actions minutes).
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: smoke-scheduled
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_SLACK_WEBHOOK: ${{ secrets.SMOKE_SLACK_WEBHOOK }}
      SMOKE_CP_USERNAME: ${{ secrets.SMOKE_CP_USERNAME }}
      SMOKE_CP_PASSWORD: ${{ secrets.SMOKE_CP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run install:browsers

      - name: Run smoke suite
        run: npm test

      - name: Notify Slack on failure
        if: failure()
        run: npm run notify -- --status failure
        env:
          SMOKE_SLACK_WEBHOOK: ${{ secrets.SMOKE_SLACK_WEBHOOK }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
